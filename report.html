<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신고 · 문의</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/styles/app.css" />
  <link rel="stylesheet" href="/styles/dashboard.css" />
</head>
<body class="pt-app">
  <header class="pt-top">
    <a href="/" class="pt-link">← 돌아가기</a>
    <span class="pt-wordmark">신고 · 문의</span>
    <a href="/terms" class="pt-link">약관</a>
  </header>
  <main class="pt-main" style="max-width:640px;">
    <section class="pt-card pt-entry-card">
      <p class="pt-entry-sub" style="margin:0 0 16px;">악용 신고·문의·제안·광고·협업 문의를 접수합니다. 운영자가 확인합니다.</p>
      <form id="report-form">
        <label class="pt-label" for="report-category">유형</label>
        <select class="pt-input" id="report-category" required></select>

        <label class="pt-label" for="report-detail" style="margin-top:12px;">내용</label>
        <textarea class="pt-input" id="report-detail" rows="6" maxlength="2000"
          placeholder="문의 또는 신고 내용을 입력하세요. (10자 이상)" required></textarea>

        <label class="pt-label" for="report-contact" style="margin-top:12px;">연락처 (선택)</label>
        <input type="text" class="pt-input" id="report-contact" maxlength="120"
          placeholder="이메일 등" autocomplete="off" />

        <button type="submit" class="pt-btn pt-btn-primary pt-btn-block pt-btn-calc">접수</button>
      </form>
      <p id="report-msg" class="pt-auth-hint hidden" style="margin-top:12px;"></p>
    </section>
    <div id="contact-footer-slot"></div>
  </main>
  <script src="/js/contact-footer.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
